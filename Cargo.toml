[package]
name = "arta"
version = "0.1.0"
edition = "2024"

[features]
cuda = ["llama-cpp-4/cuda"]

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
inventory = "0.3"
llama-cpp-4 = { version = "0.11.0", default-features = false, features = ["dynamic-link"] }
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rmcp = { version = "3.11", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "sync", "time"] }
toml = "1"
unicode-segmentation = "1"
