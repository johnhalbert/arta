[package]
name = "arta"
version = "0.1.0"
edition = "2024"

[features]
default = ["cuda"]
cuda = ["llama-cpp-4/cuda"]
hip = ["llama-cpp-4/hip"]
vulkan = ["llama-cpp-4/vulkan"]

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
inventory = "0.3"
llama-cpp-4 = { version = "0.11.0", default-features = false, features = ["dynamic-link"] }
llama-cpp-sys-4 = { version = "0.11.0", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rmcp = { version = "3.11", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "sync", "time"] }
toml = "1"
tui-markdown = { version = "0.3.13", default-features = false }
unicode-segmentation = "1"

[patch.crates-io]
llama-cpp-4 = { path = "vendor/llama-cpp-4" }
