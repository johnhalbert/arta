[package]
name = "arta-android"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
vulkan = ["arta/vulkan"]

[dependencies]
anyhow = "1"
arta = { path = "../..", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The Android 11 emulator reported spurious JNI exceptions with 0.22 during callbacks.
jni = "0.21.1"
llama-cpp-sys-4 = { version = "0.11.0", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "time"] }
