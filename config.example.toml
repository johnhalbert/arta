[app]
provider = "llama.cpp"
model = "local"

[providers."llama.cpp"]
# context_length = 4096 # Omit to cap the trained context at 4096. Set 0 for the full trained context.
# max_tokens = 256
# verbose = false
# numa = "disabled" # disabled, distribute, isolate, numactl, mirror

# [providers."llama.cpp".context]
# n_threads = 8
# n_threads_batch = 8
# n_batch = 2048
# n_ubatch = 512 # Set 0 to use the logical batch size.
# n_seq_max = 1
# n_rs_seq = 0
# n_outputs_max = 0
# n_outputs_max_per_seq = 1
# attention_type = "unspecified" # unspecified, causal, non_causal
# flash_attention = "auto" # auto, disabled, enabled
# cache_type_k = "f16" # f32, f16, bf16, q8_0, q4_0, q4_1, iq4_nl, q5_0, q5_1
# cache_type_v = "f16" # Quantized V cache requires Flash Attention.
# rope_scaling_type = "unspecified" # unspecified, none, linear, yarn
# rope_freq_base = 0.0
# rope_freq_scale = 0.0
# yarn_ext_factor = -1.0
# yarn_attn_factor = -1.0
# yarn_beta_fast = -1.0
# yarn_beta_slow = -1.0
# yarn_orig_ctx = 0
# offload_kqv = true
# op_offload = true
# swa_full = true
# kv_unified = false
# moe_cache_size = 0 # Bytes.
# no_perf = true

# Omit this table for greedy decoding. Adding it enables the llama.cpp sampler.
# [providers."llama.cpp".sampling]
# seed = 42 # Omit for a random seed.
# temp = 0.8
# samplers = ["penalties", "dry", "top_n_sigma", "top_k", "typical_p", "top_p", "min_p", "xtc", "temperature"]
# min_keep = 0
# top_k = 40
# top_p = 0.95
# min_p = 0.05
# typ_p = 1.0
# top_n_sigma = -1.0
# xtc_probability = 0.0
# xtc_threshold = 0.1
# dynatemp_range = 0.0
# dynatemp_exponent = 1.0
# penalty_last_n = 64
# penalty_repeat = 1.0
# penalty_freq = 0.0
# penalty_present = 0.0
# dry_multiplier = 0.0
# dry_base = 1.75
# dry_allowed_length = 2
# dry_penalty_last_n = 64
# dry_sequence_breakers = ["\n", ":", '"', "*"]
# adaptive_target = -1.0 # Add "adaptive_p" to samplers to use adaptive sampling.
# adaptive_decay = 0.9
# mirostat = 0 # 0 disables Mirostat, 1 selects v1, 2 selects v2.
# mirostat_tau = 5.0
# mirostat_eta = 0.1
# no_perf = false
# ignore_eos = false # Applies to unconstrained generation.
# logit_bias = [] # For example [{ token = 123, bias = -1.5 }].
# grammar_first = true
# grammar = 'root ::= "yes" | "no"' # Or use json_schema.
# json_schema = '{"type":"boolean"}'
# reasoning_budget_tokens = -1 # A nonnegative budget requires a template with reasoning tags.
# reasoning_budget_message = ""

# [providers."llama.cpp".chat]
# template = "chatml" # A built-in name or inline Jinja. Use template or template_file.
# template_file = "chat.jinja"
# template_kwargs = {}
# enable_thinking = false
# parallel_tool_calls = false
# tool_choice = "auto" # auto, required, none
# reasoning_format = "auto" # auto, none, deepseek, deepseek_legacy
# force_pure_content = false
# use_jinja = true
# add_generation_prompt = true
# add_bos = false # Whether the tokenizer handles the template's leading BOS.
# add_eos = false # Whether the tokenizer handles the template's trailing EOS.
# stop = []

[[providers."llama.cpp".models]]
id = "local"
path = "gguf/Qwen3.5-4B-Q4_0.gguf"
# gpu_layers = 0
# devices = ["CUDA0"] # Also accepts built backend names such as ROCm0 or Vulkan0. Use [] for CPU only.
# split_mode = "layer" # none, layer, row, tensor (experimental)
# main_gpu = 0 # Index into the selected devices for split_mode = "none".
# tensor_split = [3.0, 1.0] # Relative weights in device order. Omit for automatic allocation.
# tensor_buffer_overrides = [{ pattern = '^blk\.0\.', buffer_type = "CPU" }]
# check_tensors = false
# use_extra_bufts = true # Allow extra buffer types for weight repacking.
# no_host = false # Set true to bypass the host buffer.
# load_mode = "auto" # auto, none, mmap, mlock, mmap+mlock, dio
# lazy_mode = "auto" # off, auto, on
# load_mtp = false
# additional_shards = [] # Remaining GGUF shard paths, in order.
# kv_override = { key = "tokenizer.ggml.add_bos_token", value = true }

